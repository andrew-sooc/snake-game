<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Square</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎮 Catch the Square!</h1>

    </div>

    <script src="script.js"></script>

</body>
</html>
